name: Bygg plugin

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bygg plugin
        run: python scripts/bygg_plugin.py
      - name: Last opp zip som artefakt
        uses: actions/upload-artifact@v7
        with:
          name: kavli-integrasjonsdrift-plugin
          path: dist/*.zip
          if-no-files-found: error
      - name: Lag release (bare ved tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
